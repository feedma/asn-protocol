[workspace]
members = ["crates/asn-conformance", "crates/asn-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/feedma/asn-protocol"

[workspace.dependencies]
base64 = "=0.22.1"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
serde_jcs = "=0.2.0"
thiserror = "=2.0.18"
